name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: joshmyles/ems-back

jobs:
  # Go build and vet (runs on all pushes and PRs)
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # setup-go caches ~/go/pkg/mod and the build cache (keyed on go.sum);
      # a second actions/cache on the same paths fails with tar "File exists".
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Verify
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      - name: Validate Docker Compose
        run: docker compose -f docker-compose.yml config

  # Build, Push Docker Image and Deploy (only on push to main)
  build-and-deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # secrets/ is gitignored, so the Firebase Admin key comes from the
      # FIREBASE_SERVICE_ACCOUNT repo secret (full JSON of the service account
      # key). The Dockerfile bakes it in at the default credentials path.
      - name: Write Firebase service account key
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is not set"
            exit 1
          fi
          mkdir -p secrets
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > secrets/firebase-service-account.json
          jq -e '.type == "service_account" and (.project_id | length > 0) and (.private_key | length > 0)' \
            secrets/firebase-service-account.json > /dev/null \
            || { echo "::error::FIREBASE_SERVICE_ACCOUNT is not a valid Firebase Admin service account JSON"; exit 1; }
          echo "Firebase key written for project $(jq -r .project_id secrets/firebase-service-account.json)"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ensure deploy directory exists
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: mkdir -p /opt/ems-back

      - name: Copy docker-compose to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          source: 'docker-compose.yml'
          target: '/opt/ems-back/'

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            set -e
            cd /opt/ems-back

            # Login so a private image repo can be pulled
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            # Pull latest images (app from registry; infra from Docker Hub)
            docker compose -p ems-back pull

            # Start infra without force-recreating it. Restarting postgres on every
            # deploy made it briefly report unhealthy, which aborted `up` (and so
            # skipped migrations). It is only recreated when its image/config changes.
            docker compose -p ems-back up -d --no-build postgres redis

            # Migrate before the new app starts so it never runs against an old
            # schema; if this fails the previous app keeps running.
            docker compose -p ems-back run --rm migrate

            # Recreate the app containers on the new image (dependencies are not
            # force-recreated; volumes are preserved).
            docker compose -p ems-back up -d --no-build --force-recreate app worker

            # Clean up unused images
            docker image prune -f

            echo "Deployment completed successfully!"
            echo "Application is running on port 3009"
            echo "Default admin: username=admin, password=admin123"
